name: 🚀 Build & Release CheatEngine (Windows)

on:
  # Chạy thủ công từ tab Actions
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if already built this version'
        required: false
        default: 'false'
        type: boolean

  # Kiểm tra phiên bản mới mỗi ngày lúc 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Kiểm tra phiên bản CE mới nhất
  # ─────────────────────────────────────────────
  check-version:
    name: 🔍 Check Latest CE Version
    runs-on: ubuntu-latest
    outputs:
      ce_tag:       ${{ steps.get_version.outputs.ce_tag }}
      ce_version:   ${{ steps.get_version.outputs.ce_version }}
      should_build: ${{ steps.compare.outputs.should_build }}

    steps:
      - name: Get latest CE release tag
        id: get_version
        run: |
          RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/cheat-engine/cheat-engine/releases/latest")
          TAG=$(echo "$RESPONSE"  | jq -r '.tag_name')
          NAME=$(echo "$RESPONSE" | jq -r '.name')
          echo "ce_tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "ce_version=$NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Latest CE: $NAME  (tag: $TAG)"

      - name: Check if already released
        id: compare
        run: |
          TAG="${{ steps.get_version.outputs.ce_tag }}"
          FORCE="${{ github.event.inputs.force_rebuild }}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/CE-$TAG")

          if [ "$STATUS" = "200" ] && [ "$FORCE" != "true" ]; then
            echo "⏭️  CE $TAG already released — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Need to build CE $TAG"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────
  # JOB 2: Build trên Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: 🏗️ Build CheatEngine (Windows)
    runs-on: windows-2022
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'

    env:
      CE_TAG:     ${{ needs.check-version.outputs.ce_tag }}
      CE_VERSION: ${{ needs.check-version.outputs.ce_version }}

    steps:
      # ── 1. Checkout repo của chúng ta ──
      - name: Checkout CheatEngineEvo
        uses: actions/checkout@v4

      # ── 2. Clone source CE gốc theo đúng tag ──
      - name: Clone Cheat Engine source (tag ${{ env.CE_TAG }})
        shell: pwsh
        run: |
          git clone --depth 1 --branch "${{ env.CE_TAG }}" `
            https://github.com/cheat-engine/cheat-engine.git `
            ce-source
          Write-Host "✅ Cloned CE at tag ${{ env.CE_TAG }}"

      # ── 3. Cài Lazarus bằng action chuyên dụng (có cache tích hợp) ──
      # CE 7.5 (Feb 2023) cần Lazarus 2.2.x — Lazarus 3.x đổi LazFileUtils API
      - name: Setup Lazarus 2.2.6
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: '2.2.6'
          with-cache: true

      # ── 4. Kiểm tra Lazarus đã cài thành công ──
      - name: Verify Lazarus
        shell: pwsh
        run: |
          $lazbuild = Get-Command lazbuild -ErrorAction SilentlyContinue
          if (-not $lazbuild) {
            # Thử tìm trong các vị trí thông thường
            $candidates = @(
              "C:\lazarus\lazbuild.exe",
              "C:\Program Files\Lazarus\lazbuild.exe",
              "C:\Program Files (x86)\Lazarus\lazbuild.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                Write-Host "Found lazbuild at: $c"
                echo "$([System.IO.Path]::GetDirectoryName($c))" >> $env:GITHUB_PATH
                $lazbuild = $c
                break
              }
            }
          }
          if (-not $lazbuild) { throw "lazbuild not found!" }
          & lazbuild --version
          Write-Host "✅ Lazarus ready"

      # ── 5. Liệt kê build modes có sẵn trong project ──
      - name: List available build modes
        shell: pwsh
        run: |
          $lpi = "ce-source\Cheat Engine\cheatengine.lpi"
          if (Test-Path $lpi) {
            Write-Host "=== Build modes in cheatengine.lpi ==="
            Select-String -Path $lpi -Pattern 'Name="[^"]*"' |
              Where-Object { $_.Line -match 'BuildModes|Mode Name' } |
              ForEach-Object { Write-Host $_.Line.Trim() }
            # Hiện toàn bộ BuildModes section
            $content = Get-Content $lpi -Raw
            if ($content -match '(?s)<BuildModes>(.*?)</BuildModes>') {
              $Matches[1] -split "`n" | Where-Object { $_ -match 'Item' } |
                ForEach-Object { Write-Host $_.Trim() }
            }
          } else {
            Write-Warning "LPI file not found at: $lpi"
            Get-ChildItem "ce-source" -Recurse -Filter "*.lpi" |
              Select-Object FullName
          }

      # ── 6. Build 64-bit (target chính) ──
      - name: Build CheatEngine 64-bit
        shell: pwsh
        working-directory: ce-source
        run: |
          $lpi = "Cheat Engine\cheatengine.lpi"
          $modes = @("Release 64-Bit", "Release 64Bit", "Release")
          $built = $false
          foreach ($mode in $modes) {
            Write-Host "▶ Trying build mode: '$mode'"
            lazbuild $lpi --build-all --build-mode=$mode
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ 64-bit build succeeded with mode: '$mode'"
              $built = $true
              break
            }
            Write-Warning "Mode '$mode' failed (exit $LASTEXITCODE), trying next..."
          }
          if (-not $built) { throw "❌ All 64-bit build modes failed" }

      # ── 7. Build 32-bit (chỉ build nếu có ppc386 compiler) ──
      - name: Build CheatEngine 32-bit
        shell: pwsh
        working-directory: ce-source
        continue-on-error: true
        run: |
          $fpc32 = Get-Command ppc386 -ErrorAction SilentlyContinue
          if (-not $fpc32) {
            Write-Host "ℹ️ 32-bit FPC compiler (ppc386) is not installed on this 64-bit runner. Skipping 32-bit build."
            exit 0
          }
          $lpi = "Cheat Engine\cheatengine.lpi"
          $modes = @("Release 32-Bit", "Release 32Bit")
          $built = $false
          foreach ($mode in $modes) {
            Write-Host "▶ Trying build mode: '$mode'"
            lazbuild $lpi --build-all --build-mode=$mode
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ 32-bit build succeeded with mode: '$mode'"
              $built = $true
              break
            }
          }
          exit 0

      # ── 8. Build các Lazarus sub-projects phụ trợ (Speedhack, VEHDebug, WindowsRepair...) ──
      - name: Build auxiliary Lazarus projects
        shell: pwsh
        continue-on-error: true
        working-directory: ce-source
        run: |
          $lpis = Get-ChildItem -Recurse -Filter "*.lpi" |
            Where-Object { $_.Name -notmatch 'cheatengine\.lpi' }
          Write-Host "Found $($lpis.Count) auxiliary LPI project(s):"
          $lpis | ForEach-Object { Write-Host " - $($_.FullName)" }
          foreach ($p in $lpis) {
            Write-Host "`n▶ Building helper project: $($p.Name)..."
            lazbuild $p.FullName --build-all
          }

      # ── 9. Setup MSBuild để build TCC Lib và C/C++ helpers ──
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 10. Build Visual Studio solutions (TCC library, MonoDataCollector...) ──
      - name: Build C/C++ helper solutions (TCC, collectors)
        shell: pwsh
        continue-on-error: true
        working-directory: ce-source
        run: |
          $slns = Get-ChildItem -Recurse -Filter "*.sln"
          Write-Host "Found $($slns.Count) solution file(s):"
          $slns | ForEach-Object { Write-Host " - $($_.FullName)" }
          foreach ($sln in $slns) {
            Write-Host "`n========================================================"
            Write-Host "Building $($sln.Name)..."
            Write-Host "========================================================"
            # Build x64
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /maxcpucount /v:m
            # Build Win32 / 32-bit
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=Win32 /maxcpucount /v:m
          }

      # ── 11. Thu gom và đồng bộ đầy đủ các DLL, headers, helpers vào bin ──
      - name: Sync all helper DLLs and dependencies into bin
        shell: pwsh
        run: |
          $binDir = Resolve-Path "ce-source\Cheat Engine\bin"
          Write-Host "Target bin directory: $binDir"

          # 1. Quét copy tất cả file dll, exe, sys, boe được build từ các thư mục con vào bin
          Get-ChildItem -Path "ce-source" -Recurse -Include "*.dll","*.sys","*.boe" | ForEach-Object {
            if ($_.DirectoryName -ne $binDir.Path) {
              $dest = Join-Path $binDir.Path $_.Name
              if (-not (Test-Path $dest)) {
                Copy-Item -Path $_.FullName -Destination $dest -Force
                Write-Host "Copied helper: $($_.Name) -> bin"
              }
            }
          }

          # 2. Copy các thư mục include, lib, autorun, languages, tcc nếu có ở cấp source
          $subDirs = @("include", "lib", "autorun", "languages", "clibs", "tcc")
          foreach ($d in $subDirs) {
            $foundDirs = Get-ChildItem -Path "ce-source" -Recurse -Directory -Filter $d |
              Where-Object { $_.FullName -notmatch '\\bin\\' }
            foreach ($src in $foundDirs) {
              $target = Join-Path $binDir.Path $d
              if (-not (Test-Path $target)) {
                Copy-Item -Path $src.FullName -Destination $target -Recurse -Force
                Write-Host "Copied dependency folder: $($src.FullName) -> $target"
                break
              }
            }
          }

      # ── 12. Tìm và liệt kê output binaries ──
      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== Searching for built binaries in bin ==="
          Get-ChildItem "ce-source\Cheat Engine\bin" -Recurse |
            Select-Object Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,2)}}, DirectoryName |
            Format-Table -AutoSize

      # ── 13. Package artifacts ──
      - name: Package build artifacts
        shell: pwsh
        run: |
          $tag    = "${{ env.CE_TAG }}"
          $binDir = "ce-source\Cheat Engine\bin"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # Tìm thư mục output nếu không phải 'bin'
          if (-not (Test-Path $binDir)) {
            $found = Get-ChildItem "ce-source" -Recurse -Directory |
              Where-Object { $_.Name -in @('bin','output','Release') } |
              Select-Object -First 1
            if ($found) {
              $binDir = $found.FullName
              Write-Host "Using output dir: $binDir"
            } else {
              throw "Cannot find build output directory!"
            }
          }

          $zipPath = "dist\CheatEngineEvo-$tag-windows.zip"
          Compress-Archive -Path "$binDir\*" -DestinationPath $zipPath -Force
          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "✅ Packaged: $zipPath ($sizeMB MB)"

      # ── 14. Upload artifact ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ce-windows-${{ env.CE_TAG }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Tạo GitHub Release
  # ─────────────────────────────────────────────
  create-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, build-windows]
    if: needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: write

    env:
      CE_TAG:     ${{ needs.check-version.outputs.ce_tag }}
      CE_VERSION: ${{ needs.check-version.outputs.ce_version }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ce-windows-${{ env.CE_TAG }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  "CE-${{ env.CE_TAG }}"
          name:      "CheatEngine Evo ${{ env.CE_VERSION }} (Windows)"
          body: |
            ## CheatEngine Evo — Windows Build

            | | |
            |---|---|
            | **Source** | [cheat-engine/cheat-engine @ ${{ env.CE_TAG }}](https://github.com/cheat-engine/cheat-engine/tree/${{ env.CE_TAG }}) |
            | **Built with** | Lazarus 2.2.6 / FPC 3.2.2 |
            | **Platform** | Windows x86_64 (64-bit) |

            ### Files
            - `CheatEngineEvo-${{ env.CE_TAG }}-windows.zip` — Windows 64-bit binaries

            > Built automatically by [CheatEngineEvo CI](https://github.com/${{ github.repository }}/actions)
          draft: false
          prerelease: false
          files: dist/CheatEngineEvo-${{ env.CE_TAG }}-windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "🎉 Release CE-${{ env.CE_TAG }} published at https://github.com/${{ github.repository }}/releases/tag/CE-${{ env.CE_TAG }}"
